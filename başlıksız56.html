<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<title>MİTOS — Ejderha İni</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05030f;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#game{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;z-index:2;
background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.6) 100%)}
#hurt{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .3s;
background:radial-gradient(ellipse at center,transparent 35%,rgba(255,25,15,.5))}
#hurt.on{opacity:1;transition:opacity .04s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}

/* ---------- TOP HUD ---------- */
#topHud{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:14px;right:14px;z-index:5;pointer-events:none}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#bossName{flex:1;text-align:center;font-size:10px;font-weight:800;letter-spacing:3px;color:#f0c878;
text-shadow:0 0 12px rgba(240,180,80,.5)}
#muteBtn{pointer-events:auto;width:34px;height:34px;border-radius:50%;background:rgba(22,12,32,.65);
border:1px solid rgba(255,210,130,.25);color:#ffd9a0;font-size:15px}
#bossBarWrap{position:relative;height:13px;border-radius:8px;background:rgba(18,8,24,.75);
border:1px solid rgba(240,200,120,.4);overflow:hidden}
#bossBarWrap::after{content:'';position:absolute;inset:0;
background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(0,0,0,.35) 26px 28px)}
#bossTrail,#bossBar{position:absolute;top:0;bottom:0;left:0;width:100%}
#bossTrail{background:#ffdf8a}
#bossBar{background:linear-gradient(180deg,#ff6a3d,#c21f2f);box-shadow:0 0 12px rgba(255,80,40,.6) inset}

/* ---------- BOTTOM HUD ---------- */
#bottomHud{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;
align-items:center;gap:9px;padding:26px 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none;
background:linear-gradient(to top,rgba(8,4,16,.94) 55%,rgba(8,4,16,.6) 80%,transparent)}
#pRow{display:flex;align-items:center;gap:10px;width:100%;max-width:420px}
#pBarWrap{flex:1;height:9px;border-radius:6px;background:rgba(10,20,18,.8);
border:1px solid rgba(90,255,170,.35);overflow:hidden}
#pBar{height:100%;width:100%;background:linear-gradient(90deg,#2fae72,#6dffb0);transition:width .15s}
#pBarWrap.low #pBar{background:linear-gradient(90deg,#c21f2f,#ff6a3d);animation:lowP .6s infinite alternate}
@keyframes lowP{from{filter:brightness(.8)}to{filter:brightness(1.5)}}
#pips{display:flex;gap:7px;padding:4px}
.pip{width:13px;height:13px;transform:rotate(45deg);border-radius:3px;border:1.5px solid #63ffa8;transition:.2s}
.pip.on{background:#63ffa8;box-shadow:0 0 10px #63ffa8}
.pip.pop{animation:pipPop .35s}
@keyframes pipPop{50%{transform:rotate(45deg) scale(1.7)}}
#pips.shakeS{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

#hand{display:flex;gap:10px;justify-content:center}
.slot{width:min(23vw,92px);aspect-ratio:5/7}
.card{--c:#fff;--glow:rgba(255,255,255,.35);width:100%;height:100%;border-radius:13px;position:relative;
overflow:hidden;touch-action:none;cursor:grab;pointer-events:auto;
background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 60%);
border:1px solid rgba(255,255,255,.22);
box-shadow:0 8px 18px -8px rgba(0,0,0,.8),0 0 18px -4px var(--glow),inset 0 0 14px rgba(255,255,255,.05);
backdrop-filter:blur(4px)}
.card.deal{animation:dealIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes dealIn{0%{transform:translateY(95px) scale(.5);opacity:0}60%{transform:translateY(-8px) scale(1.05);opacity:1}100%{transform:none}}
.card.drag{transition:none!important;cursor:grabbing}
.card.lift{box-shadow:0 16px 32px -8px rgba(0,0,0,.9),0 0 30px -2px var(--glow),inset 0 0 18px rgba(255,255,255,.12)}
.card.ready{box-shadow:0 0 30px 3px var(--glow),inset 0 0 20px rgba(255,255,255,.18)}
.card.used{transition:transform .22s ease-out,opacity .22s ease-out;
transform:scale(1.4)!important;opacity:0!important;pointer-events:none}
.card.wobble{animation:wob .32s}
@keyframes wob{20%{transform:rotate(-6deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}100%{transform:none}}
.card .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.16) 46%,transparent 58%);
animation:shine 3.4s infinite}
@keyframes shine{0%,55%{transform:translateX(-110%)}90%,100%{transform:translateX(110%)}}
.throwHint{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:900;
letter-spacing:1.5px;color:#ffe9b0;opacity:0;transition:opacity .15s;text-shadow:0 0 8px rgba(255,200,100,.9);z-index:2}
.card.ready .throwHint{opacity:1;animation:bobY .45s infinite alternate}
@keyframes bobY{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.card .art{position:absolute;left:22%;right:22%;top:14%;bottom:32%;color:var(--c);
filter:drop-shadow(0 0 7px var(--glow))}
.card .art svg{width:100%;height:100%}
.card .cname{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:9.5px;
font-weight:800;letter-spacing:2.5px;color:var(--c);text-shadow:0 0 8px var(--glow)}
.t-sword{--c:#8fdcff;--glow:rgba(120,215,255,.5)}
.t-fire{--c:#ffa04d;--glow:rgba(255,140,60,.55)}
.t-lightning{--c:#ffe15e;--glow:rgba(255,220,80,.55)}
.t-move{--c:#6dffb0;--glow:rgba(90,255,170,.55)}

#ctrls{display:flex;align-items:center;gap:18px}
.mbtn{pointer-events:auto;width:66px;height:52px;border-radius:14px;font-size:20px;color:#ffd9a0;
background:linear-gradient(180deg,#3a2450,#1d1130);border:1px solid rgba(255,200,120,.3);
box-shadow:0 4px 12px -4px rgba(0,0,0,.7);transition:transform .08s,opacity .2s}
.mbtn.off{opacity:.3}
.mbtn:active{transform:scale(.9)}
#dodgeBtn{pointer-events:auto;position:relative;width:86px;height:86px;border-radius:50%;
background:radial-gradient(circle at 35% 28%,#7a4630,#2b1420 72%);
border:2px solid rgba(255,170,90,.55);color:#ffe0b0;font-weight:900;font-size:13px;letter-spacing:1.5px;
box-shadow:0 0 26px -4px rgba(255,140,60,.55),inset 0 2px 6px rgba(255,220,160,.25);transition:transform .08s}
#dodgeBtn:active{transform:scale(.9)}
#dodgeBtn.cding{filter:grayscale(.4) brightness(.8)}
#dodgeCd{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}

#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 270px);transform:translateX(-50%) translateY(10px);
z-index:9;pointer-events:none;background:rgba(20,12,32,.9);border:1px solid rgba(255,210,130,.35);
color:#ffe0b0;font-size:12px;font-weight:700;letter-spacing:.5px;padding:9px 18px;border-radius:20px;
opacity:0;transition:.25s;white-space:nowrap;box-shadow:0 6px 18px -6px rgba(0,0,0,.8)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- DUYURULAR ---------- */
#annWrap{position:absolute;top:24%;left:0;right:0;z-index:8;pointer-events:none;display:flex;justify-content:center}
.ann{position:absolute;font-family:Georgia,'Times New Roman',serif;font-weight:900;font-style:italic;
font-size:clamp(26px,8vw,48px);white-space:nowrap;
background:linear-gradient(180deg,#ffe9b0,#f0a83c);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 2px 14px rgba(240,170,60,.5));animation:annA 1.4s forwards}
.ann.perfect{background:linear-gradient(180deg,#d8fff2,#4be0b0);filter:drop-shadow(0 2px 14px rgba(80,230,180,.55))}
.ann.rage{background:linear-gradient(180deg,#ffc0a8,#ff3d2e);filter:drop-shadow(0 2px 14px rgba(255,60,40,.55))}
@keyframes annA{0%{transform:scale(.3);opacity:0}16%{transform:scale(1.14);opacity:1}30%{transform:scale(1)}
72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-18px) scale(.96)}}

/* ---------- EKRANLAR ---------- */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:16px;background:rgba(5,2,12,.6);backdrop-filter:blur(7px);transition:opacity .45s;padding:20px}
.screen.hide{opacity:0;pointer-events:none}
#menu{background:radial-gradient(130% 90% at 50% 0%,#241344 0%,#0d0620 52%,#050310 100%);backdrop-filter:none;overflow:hidden}
.mContent{display:flex;flex-direction:column;align-items:center;gap:18px;z-index:2}
.mRing{position:absolute;top:5%;left:50%;width:min(84vw,360px);aspect-ratio:1;transform:translateX(-50%);
border:1px dashed rgba(240,190,90,.22);border-radius:50%;animation:spin 26s linear infinite;pointer-events:none}
.mRing.r2{width:min(58vw,240px);animation-duration:17s;animation-direction:reverse;border-color:rgba(140,200,255,.16)}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.mEmber{position:absolute;bottom:-12px;border-radius:50%;background:#ff9a4d;pointer-events:none;
box-shadow:0 0 8px 2px rgba(255,140,60,.7);opacity:0;animation:emberUp linear infinite}
@keyframes emberUp{0%{transform:translateY(0) translateX(0)}8%{opacity:.85}
80%{opacity:.5}100%{transform:translateY(-108vh) translateX(24px);opacity:0}}
.mTitle{font-family:Georgia,serif;font-weight:900;font-style:italic;font-size:clamp(52px,16vw,84px);letter-spacing:8px;
background:linear-gradient(180deg,#fff2c8,#f0a83c 70%,#a86818);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 4px 24px rgba(240,170,60,.4))}
.mSub{font-size:12px;letter-spacing:6px;color:#c8b090;font-weight:700}
.mDesc{text-align:center;font-size:13px;line-height:2;color:#9a8ab0}
.mDesc b{color:#ffd9a0}
.goldBtn{padding:15px 46px;border-radius:40px;border:1px solid #b47d1e;font-size:15px;font-weight:900;
letter-spacing:3px;color:#3a2404;background:linear-gradient(180deg,#ffe9a8,#e8a53c);
box-shadow:0 8px 28px -6px rgba(240,180,80,.65),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .1s}
.goldBtn:active{transform:scale(.93)}
#endTitle{font-family:Georgia,serif;font-weight:900;font-style:italic;font-size:clamp(40px,12vw,64px);letter-spacing:4px}
#endTitle.winT{background:linear-gradient(180deg,#fff2c8,#f0a83c);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 4px 20px rgba(240,170,60,.5))}
#endTitle.loseT{background:linear-gradient(180deg,#ffb0a0,#a01818);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 4px 20px rgba(255,60,40,.4))}
#endStats{display:flex;gap:26px;margin:6px 0 10px}
#endStats div{display:flex;flex-direction:column;align-items:center;gap:4px}
#endStats b{font-size:9px;letter-spacing:2px;color:#9a8ab0}
#endStats span{font-size:22px;font-weight:900;color:#ffd9a0}
</style>
</head>
<body>
<div id="game">
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="hurt"></div>
<div id="flash"></div>

<div id="topHud">
 <div class="trow"><div id="bossName">HYDRAGON • ÜÇ BAŞLI EJDERHA</div><button id="muteBtn">♪</button></div>
 <div id="bossBarWrap"><div id="bossTrail"></div><div id="bossBar"></div></div>
</div>

<div id="bottomHud">
 <div id="pRow">
  <div id="pBarWrap"><div id="pBar"></div></div>
  <div id="pips"><span class="pip"></span><span class="pip"></span></div>
 </div>
 <div id="hand"><div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div></div>
 <div id="ctrls">
  <button class="mbtn" id="btnL">◀</button>
  <button id="dodgeBtn">KAÇIN<div id="dodgeCd"></div></button>
  <button class="mbtn" id="btnR">▶</button>
 </div>
</div>

<div id="toast"></div>
<div id="annWrap"></div>

<div class="screen" id="menu">
 <div class="mRing"></div><div class="mRing r2"></div>
 <div class="mContent">
  <div class="mTitle">MİTOS</div>
  <div class="mSub">— EJDERHA İNİ —</div>
  <div class="mDesc">Yeşil <b>HAREKET</b> kartına <b>dokun</b> • Saldırı kartını <b>ejderhaya doğru savur</b><br>
  ◀ ▶ ile şerit değiştir • Saldırı anında <b>KAÇIN</b>'a son anda bas<br>
  Yerdeki <b>gayzerlere</b> dikkat et</div>
  <button class="goldBtn" id="startBtn">SAVAŞA BAŞLA</button>
 </div>
</div>

<div class="screen hide" id="end">
 <div id="endTitle" class="winT">ZAFER</div>
 <div id="endStats"></div>
 <button class="goldBtn" id="againBtn">TEKRAR SAVAŞ</button>
</div>
</div>

<script>
/* ================= TEMEL ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const TAU=Math.PI*2;
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const laneX=i=>W*(0.22+0.28*i);
const groundY=()=>H*0.615;
const horizon=()=>H*0.40;
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

let stars=[],cracks=[],craters=[];
function buildStatics(){
 stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*horizon()*0.9,r:rand(.5,1.6),p:rand(0,TAU)});
 cracks=[];for(let i=0;i<7;i++){const pts=[];let x=rand(W*0.05,W*0.95),y=rand(H*0.45,H*0.85);pts.push({x,y});
  for(let k=0;k<4;k++){x+=rand(-W*0.09,W*0.09);y+=rand(H*0.02,H*0.06);pts.push({x,y});}cracks.push(pts);}
 craters=[];for(let i=0;i<6;i++)craters.push({x:rand(W*0.1,W*0.9),y:rand(H*0.45,H*0.85),r:rand(8,22)});
}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);buildStatics();}
addEventListener('resize',resize);

const glowC={};
function glowSpr(rgb){let c=glowC[rgb];if(c)return c;c=document.createElement('canvas');c.width=c.height=64;
 const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(0.35,`rgba(${rgb},0.55)`);gr.addColorStop(1,`rgba(${rgb},0)`);
 g.fillStyle=gr;g.fillRect(0,0,64,64);glowC[rgb]=c;return c;}
function drawGlow(x,y,r,rgb,a){if(a===undefined)a=1;ctx.globalAlpha=clamp(a,0,1);
 ctx.drawImage(glowSpr(rgb),x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
function ln(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ================= SES ================= */
let AC=null,master,nbuf,muted=false;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
 nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
 const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
 o1.type='sawtooth';o1.frequency.value=55;o2.type='sawtooth';o2.frequency.value=55.7;
 f.type='lowpass';f.frequency.value=140;g.gain.value=.05;
 o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.1;lg.gain.value=45;
 lfo.connect(lg);lg.connect(f.frequency);o1.start();o2.start();lfo.start();}
document.addEventListener('pointerdown',()=>{if(AC&&AC.state==='suspended')AC.resume();},{capture:true});
function tone(f0,f1,dur,type,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
 o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
 g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}
function noiseS(dur,vol,fq,q,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);
 const n=AC.createBufferSource();n.buffer=nbuf;n.loop=true;
 const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1000;f.Q.value=q||1;
 const g=AC.createGain();g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.03);}
const sfxThrow=()=>{noiseS(.25,.14,900,1);tone(300,620,.15,'triangle',.07);};
const sfxHit=()=>{tone(220,70,.15,'square',.16);noiseS(.12,.18,2500,2);};
const sfxCounter=()=>{tone(880,1500,.22,'sine',.15);};
const sfxThunder=()=>{noiseS(.4,.4,3000,.7);tone(1300,110,.3,'sawtooth',.09);};
const sfxFireball=()=>{noiseS(.45,.2,520,1);};
const sfxBreath=()=>{noiseS(1.2,.26,700,.8);};
const sfxGeyser=()=>{noiseS(.6,.3,190,1);tone(72,42,.5,'sine',.3);};
const sfxWarn=()=>{tone(520,390,.1,'square',.06);tone(520,390,.1,'square',.06,.14);};
const sfxDodge=()=>{noiseS(.2,.17,1600,1.5);tone(700,1100,.14,'sine',.07);};
const sfxMove=()=>{noiseS(.12,.1,800,2);};
const sfxHurt=()=>{tone(160,58,.25,'sawtooth',.24);noiseS(.15,.2,420,1);};
const sfxDeny=()=>{tone(185,140,.1,'square',.12);};
const sfxCollect=()=>{tone(660,990,.12,'sine',.12);tone(990,1350,.14,'sine',.1,.08);};
const sfxPerfect=()=>{tone(740,740,.1,'sine',.13);tone(988,988,.1,'sine',.13,.08);tone(1480,1480,.2,'sine',.13,.16);};
const sfxRoar=()=>{tone(92,44,.9,'sawtooth',.32);noiseS(.9,.28,260,1);tone(62,38,.9,'square',.18);};
const sfxWin=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f,.3,'sine',.14,i*.14));};
const sfxLose=()=>{[330,262,196,131].forEach((f,i)=>tone(f,f*.9,.4,'sawtooth',.12,i*.18));};

/* ================= DURUM ================= */
let state='menu',T=0,slowT=0,hitStop=0,shakeM=0,gen=0,shownEnd=false,dragAim=false;
let beatT=0,beatN=0;
const DODGE_DUR=0.42;
const player={lane:1,x:0,hp:100,maxHp:100,charges:1,dead:false,dodgeT:0,invT:0,invMax:.35,
 cdT:0,dashT:0,dashDir:1,hurtT:0,anim:0,deathT:0};
const dragon={hp:550,maxHp:550,phase:1,dying:false,dieT:0,flash:0,atkT:2.4,jaw:[0,0,0]};
let warnings=[],shots=[],pshots=[],breaths=[],erupts=[],lightnings=[],parts=[],floats=[],ghosts=[];
let ghostT=0;
let stats={throws:0,perfect:0,t0:0};
function shake(m){shakeM=Math.max(shakeM,m);}

/* ================= KARTLAR ================= */
const hand=[null,null,null];
const slots=[$('#s0'),$('#s1'),$('#s2')];
const CARD_INFO={sword:{name:'KILIÇ',rgb:'140,220,255',dmg:40},fire:{name:'ALEV',rgb:'255,140,60',dmg:44},
 lightning:{name:'YILDIRIM',rgb:'255,220,80',dmg:48},move:{name:'HAREKET',rgb:'90,255,170',dmg:0}};
const ICONS={

function bindDrag(el,i){

 el.addEventListener('pointerdown',e=>{
  if(state!=='play'||player.dead||dragon.dying)return;
  act=true;t0=performance.now();moved=0;dx=0;dy=0;
  el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;
  el.classList.add('drag','lift');el.classList.remove('deal');
  vib(8);e.preventDefault();});
 el.addEventListener('pointermove',e=>{
  if(!act)return;
  dx=e.clientX-sx;dy=e.clientY-sy;
  moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
  dy=Math.min(dy,12);
  el.style.transform=`translate(${dx*0.6}px,${dy}px) rotate(${dx*0.06}deg) scale(${1+Math.min(-dy,130)/600})`;
  const isAttack=hand[i]&&hand[i].type!=='move';
  el.classList.toggle('ready',dy<-70);

  if(w.kind==='breath'&&i===1)j=Math.max(j,0.4+0.6*(w.t/w.dur));}

  s.style.animationDelay=rand(0,7)+'s';m.appendChild(s);}})();

/* ================= ANA DÖNGÜ ================= */
let last=0;
function update(dt,rdt){
 if(state==='play')updAttacks(dt);
 updWarnings(dt);updShots(dt);updBreaths(dt);updErupts(dt);
 updPshots(dt);updLightnings(dt);updDragon(dt);updPlayer(dt);updGhosts(dt);
 updParticles(dt);updFloats(dt);ambient(dt);
 if(AC&&!muted&&state==='play'){beatT-=rdt;
  if(beatT<=0){beatT=1.4;beatN++;tone(95,42,.25,'sine',.26);
   if(beatN%2===0)noiseS(.3,.06,160,1,.7);
   if(beatN%4===0)tone(190,90,.18,'triangle',.08,.35);}}
 updateHUD(rdt);}
function render(){
 ctx.clearRect(0,0,W,H);
 let ox=0,oy=0;
 if(shakeM>0){ox=rand(-shakeM,shakeM);oy=rand(-shakeM,shakeM);}
 ctx.save();ctx.translate(ox,oy);
 drawSky();drawGround();drawWarnings();drawDragon();drawAim();drawBreaths();
 drawErupts();drawShots();drawLightnings();drawGhosts();drawPlayer();drawPshots();
 drawParticles();drawFloats();
 ctx.restore();
 shakeM*=0.88;if(shakeM<0.3)shakeM=0;}
function loop(ts){
 requestAnimationFrame(loop);
 const rdt=Math.min((ts-last)/1000||0,0.05);last=ts;
 if(slowT>0)slowT-=rdt;
 let dt=rdt*(slowT>0?0.3:1);
 if(hitStop>0){hitStop-=rdt;dt=0;}
 T+=dt;
 update(dt,rdt);render();}
resize();
player.x=laneX(1);
updatePips();
requestAnimationFrame(loop);
</script>
